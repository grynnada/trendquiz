<style>

@media(max-width:480px){.opts{grid-template-columns:1fr}}
</style></head><body><main>
<h1 id="ttl">Trend Quiz</h1>
<p class="sub" id="sub"></p>
<div id="app"></div>
</main>
<script>
//LOGIC
const R=(a,b)=>Math.round(a+Math.random()*(b-a)),NAME={1:'Uptrend','-1':'Downtrend'};
// Rules engine: market state after each turning point + control points (current or last)
function analyse(p){
  let st='C',anchor=0,brk=-1,Z=0,CZ=0,hi,lo,hiI,loI,mn=Infinity,mnI,mx=-Infinity,mxI,out=['C'],cp=null,ev=[];
  const snap=()=>{cp={t:st,hi,hiI,lo,loI,Z,A:anchor,CZ}};
  // From a start point: the first extreme after it, the pullback from that extreme, then a push beyond the first extreme forms a trend.
  // Small moves in between are noise, so control points effectively move along to each new extreme until a trend forms.
  const scan=(s,upTo,dir,minJ)=>{const sg=dir==='U'?1:-1;let S=Infinity,SI=-1,H=-Infinity,L1=Infinity,L1I=-1;
    for(let k=s;k<=upTo;k++){const v=sg*p[k];
      if(v<S){S=v;SI=k;H=-Infinity;L1=Infinity;L1I=-1}
      else if(v>H){if(L1I>=0&&k>minJ)return{t:dir,j:k,Z:SI,ci:L1I,s};H=v;L1=Infinity;L1I=-1}
      else if(H>-Infinity&&v<L1){L1=v;L1I=k}}
    return null};
  const find=(A,i,dirs,minJ)=>{let b=null;for(const d of dirs)for(let s=A;s<=i-3;s++){const f=scan(s,i,d,minJ);if(f&&(!b||f.j<b.j||(f.j===b.j&&f.s<b.s)))b=f}return b};
  // where the relevant segments start: the earliest point (from the last control point on) that makes the trend's first extreme a record. Fixed when the trend forms.
  const startFor=(t,H,A,z0)=>{const sg=t==='U'?1:-1,q=p.map(v=>sg*v),recs=z=>{const r=[];let m=-Infinity;for(let i=z+1;i<=H;i++)if(q[i]>q[i-1]&&q[i]>m){r.push(i);m=q[i]}return r};
    for(let s=A;s<=H-3;s++){const r=recs(s);if(r.length>=2&&r[r.length-1]===H)return s}return z0};
  const put=f=>{Z=f.Z;CZ=startFor(f.t,f.j,anchor,f.Z);ev.push({k:'t',t:f.t,j:f.j,Z:f.Z});
    if(f.t==='U'){st='U';hi=p[f.j];hiI=f.j;lo=p[f.ci];loI=f.ci;mn=Infinity}else{st='D';lo=p[f.j];loI=f.j;hi=p[f.ci];hiI=f.ci;mx=-Infinity}snap()};
  for(let i=1;i<p.length;i++){
    const up=p[i]>p[i-1],v=p[i],was=st;
    if(st==='U'){
      if(up){if(v>hi){hi=v;hiI=i;lo=mn;loI=mnI;mn=Infinity;snap()}}
      else if(v<lo){ev.push({k:'b',i,cp});st='C';anchor=hiI;brk=i}else if(v<mn){mn=v;mnI=i}
    }else if(st==='D'){
      if(!up){if(v<lo){lo=v;loI=i;hi=mx;hiI=mxI;mx=-Infinity;snap()}}
      else if(v>hi){ev.push({k:'b',i,cp});st='C';anchor=loI;brk=i}else if(v>mx){mx=v;mxI=i}
    }
    if(st==='C'){
      // at a break, a trend may already have formed from the last control point (against the old trend, inside its controls)
      const f=was!=='C'?find(anchor,i,[was==='U'?'D':'U'],-1):find(anchor,i,['D','U'],brk);
      if(f){put(f);if(f.j<i){out.length=f.j;out.push(st);i=f.j;continue}}
    }
    out.push(st);
  }
  return {out,cp,cur:st!=='C',ev};
}
// Chart builder: 5 sections following the notes' rules; the engine verifies every section
const HB=67; // typical chart height (body range) used to size big gaps
function build(fw,ns=5,plan=[]){
  const t=['E'];
  for(let i=1;i<ns;i++){const pv=t[i-1],r=Math.random();
    t.push((fw&&i==1)?'W':pv==='X'?(r<.3?'N':r<.6?'T':(r<.75&&i<ns-1)?'K':(i==ns-1&&r>.7)?'F':'T'):pv==='K'?'T':('ECNTWY'.includes(pv)&&Math.random()<.25)?(Math.random()<.5?'W':'Y'):['C','C','I','X','X'][R(0,4)])}
  const exs={},gr=[];
  if(plan.length){const el=[];t.forEach((k,i)=>{if('ECXN'.includes(k))el.push(i)});if(el.length<plan.length)return null;el.sort(()=>Math.random()-.5);plan.forEach((q,j)=>{exs[el[j]]=q})}
  let s=Math.random()<.5?1:-1,p=[R(30,70)],ext,ctl,extI,low=null,B,old,secs=[];
  const sl=(a,b)=>s*(a-b)<0?a:b;
  const three=(c,d,lr,hr)=>{const Bm=d>0?hr:-lr,v0=d*c;if(Bm-7<v0+8)return null;
    const v1=R(v0+8,Bm-7),v2=R(v0+4,v1-4),v3=R(v1+4,Bm-3);return[v1,v2,v3].map(v=>d*v)};
  for(let si=0;si<t.length;si++){
    const k=t[si],xg=exs[si]?exs[si].r*HB/(1-exs[si].r):0;let lab;
    if(k==='E'){const a=R(16,26)+xg,b=R(6,a-6),c=R(8,20),p1=p[0]+s*a;p.push(p1,p1-s*b,p1+s*c);ext=p[3];ctl=p[2];extI=3;lab=NAME[s]}
    else if(k==='C'){const r=s*(ext-ctl);if(r<10)return null;const b=R(6,r-4),p1=ext-s*b;p.push(p1,ext+s*(R(8,20)+xg));ctl=low===null?p1:sl(low,p1);ext=p[p.length-1];extI=p.length-1;low=null;lab=NAME[s]+' Cont.'}
    else if(k==='I'){const r=s*(ext-ctl);if(r<14)return null;const b=R(9,r-4),p1=ext-s*b;p.push(p1,p1+s*R(5,b-4));low=low===null?p1:sl(low,p1);lab='Pullback'}
    else if(k==='X'){B=ctl-s*(R(8,16)+xg);old=ext;p.push(B);lab='Break'}
    else if(k==='W'){const r=-s,rng=s*(ext-ctl),e0=p[p.length-1];if(rng<20)return null;
      const ub=r*ctl-4,v0=r*e0,v1=R(v0+8,ub-4),v2=R(v0+4,v1-4),v3=R(v1+4,ub),v4=R(v2+3,v3-4),v5=r*ctl+R(8,16);
      p.push(...[v1,v2,v3,v4,v5].map(v=>r*v));s=r;ext=p[p.length-1];ctl=p[p.length-2];extI=p.length-1;low=null;lab=NAME[s]}
    else if(k==='Y'){const r=-s,rng=s*(ext-ctl),e0=p[p.length-1];if(rng<22)return null;
      const ub=r*ctl-4,v0=r*e0,vE=r*ctl+R(8,16);let vals,ctlV;
      if(Math.random()<.5){ // first extreme, a pullback with small moves inside it, then a push beyond the first extreme that breaks the old trend
        const v1=R(v0+10,ub),d1=R(v0+4,v1-7);
        if(Math.random()<.5){vals=[v1,d1,vE];ctlV=d1}else{const u1=R(d1+3,v1-4),d2=R(v0+4,u1-3);vals=[v1,d1,u1,d2,vE];ctlV=Math.min(d1,d2)}
      }else{ // the new trend forms inside the old control points, then runs on through them
        const v1=R(v0+10,ub-8),d1=R(v0+4,v1-6),v3=R(v1+4,ub),d2=R(d1+3,v3-4);vals=[v1,d1,v3,d2,vE];ctlV=d2;
      }
      p.push(...vals.map(v=>r*v));s=r;ext=p[p.length-1];ctl=r*ctlV;extI=p.length-1;low=null;lab=NAME[s]}
    else if(k==='K'){const g=s*(old-B);if(g<10)return null;const a=R(8,g+10),b=R(4,a-4),q1=B+s*a;p.push(q1,q1-s*b);lab='Range'}
    else if(k==='T'){const seg=p.slice(extI),q=three(p[p.length-1],s,Math.min(...seg),Math.max(...seg));if(!q)return null;p.push(...q);ext=q[2];ctl=q[1];extI=p.length-1;low=null;lab='New '+NAME[s]}
    else{const g=s*(old-B);if(g<10)return null;const a=R(6,g-4);p.push(B+s*a);
      if(k==='N'){p.push(B-s*(R(5,12)+xg));s=-s;ext=p[p.length-1];ctl=p[p.length-2];extI=p.length-1;low=null;lab=NAME[s]}else lab='Bounce'}
    if(xg)gr.push({k:k==='E'?1:p.length-1,g:xg,t:exs[si].tier});
    secs.push({k,lab,end:p.length-1,tr:s});
  }
  const sp=[...p].sort((x,y)=>x-y);for(let m=0;m<sp.length-1;m++)if(sp[m+1]-sp[m]<(ns>5?1:2))return null;
  const a=analyse(p),st=a.out;
  for(const x of secs){const e=st[x.end],want=('XFK'.includes(x.k))?'C':(x.tr>0?'U':'D');if(e!==want)return null}
  const H0=Math.max(...p)-Math.min(...p);for(const x of gr){const q=x.g/H0;if(x.t==='V'?(q<.24||q>.42):(q<.09||q>=.24))return null}
  const f=st[st.length-1];
  return{p,secs,gr,cp:a.cp,cur:a.cur,ev:a.ev,hard:secs.some(x=>x.k==='T'||x.k==='W'||x.k==='Y'),rel:a.cur?relevant(p,a.cp):null,ans:f==='U'?'Uptrend':f==='D'?'Downtrend':'Consolidation'};
}
// Relevant segments of a trend: record highs (or lows) with the extreme pullback between them; small moves in between are ignored.
// The chain starts from the earliest point (from the last control point onwards) for which the final extreme is a record.
function chain(p,cp){
  const sg=cp.t==='U'?1:-1,q=p.map(v=>sg*v),H=sg>0?cp.hiI:cp.loI;
  const lw=(a,b)=>{let k=a;for(let i=a;i<=b;i++)if(q[i]<q[k])k=i;return k};
  const recs=z=>{const r=[];let m=-Infinity;for(let i=z+1;i<=H;i++)if(q[i]>q[i-1]&&q[i]>m){r.push(i);m=q[i]}return r};
  let z=cp.CZ??cp.A??cp.Z,rec=recs(z);
  if(!(rec.length>=2&&rec[rec.length-1]===H))for(let s=cp.A??cp.Z;s<=H-3;s++){const r=recs(s);if(r.length>=2&&r[r.length-1]===H){z=s;rec=r;break}}
  const o=[lw(z,rec[0])];rec.forEach((r,k)=>{o.push(r);if(k<rec.length-1)o.push(lw(r,rec[k+1]))});return o;
}
const relevant=(p,cp)=>chain(p,cp).slice(-4);
function phases(c){
  const sl=[],n=c.p.length-1;let brk=null,cpB=null;
  for(const e of c.ev){
    if(e.k==='t'){if(brk!==null){if(e.Z>brk)sl.push({k:'c',a:brk,b:e.Z,cp:cpB});brk=null}}
    else{sl.push({k:'T',cp:e.cp},{k:'B',i:e.i,cp:e.cp});brk=e.i;cpB=e.cp}
  }
  if(brk!==null){if(n>brk)sl.push({k:'c',a:brk,b:n,cp:cpB})}else sl.push({k:'T',cp:c.cp});
  return sl;
}
// Candlestick version: every line (point-to-point) becomes 1-3 candles whose bodies tile the move; gaps are read as same-direction candles
const MB=4,MINB=2.4,MINBR=5,rnd=(a,b)=>a+Math.random()*(b-a);
function capOf(c,N){const S=c.p.length-1;if(S>N)return 0;const G={};(c.gr||[]).forEach(x=>G[x.k]=x.g);let t=0;for(let k=1;k<=S;k++)t+=Math.max(1,Math.floor((Math.abs(c.p[k]-c.p[k-1])-(G[k]||0))/MB));return t}
// Advanced mode: mostly small/medium gaps, occasional large or very large (RTH-style) ones, and a wide wick range
function gapSize(){const r=Math.random();return r<.6?rnd(2.5,4):r<.9?rnd(4,8):rnd(5,9)}
function wickLen(){const r=Math.random();return r<.2?rnd(0,.8):r<.62?rnd(1,3):r<.88?rnd(3,8):r<.97?rnd(8,16):rnd(16,28)}
// A gap is read as a candle that opens at the previous close and closes at the next open; this returns the real price path
function effective(cd){
  const runs=[],add=(f,t,ci)=>{const s=t>f?1:-1,r=runs[runs.length-1];if(r&&r.s===s){r.t=t;r.ci=ci}else runs.push({f,t,ci,s})};
  cd.forEach((k,i)=>{if(i&&Math.abs(k.o-cd[i-1].c)>1e-9)add(cd[i-1].c,k.o,i);if(Math.abs(k.c-k.o)>1e-9)add(k.o,k.c,i)});
  return{p:[cd[0].o,...runs.map(r=>r.t)],ptc:[0,...runs.map(r=>r.ci)]};
}
function convert(c,N,adv,cx){
  const p=c.p,S=p.length-1,cap=[],cnt=[],cd=[],last=[0],bigB=new Set(),GMIN=adv?2.5:3,gsz=()=>adv?gapSize():rnd(3,5),gp=adv?.3:.22,GR={};
  (c.gr||[]).forEach(x=>GR[x.k]=x.g);
  for(let k=1;k<=S;k++){cap[k]=Math.max(1,Math.floor((Math.abs(p[k]-p[k-1])-(GR[k]||0))/MB));cnt[k]=1}
  for(let rem=N-S;rem>0;rem--){const ks=[];for(let k=1;k<=S;k++)for(let r=cnt[k];r<cap[k];r++)ks.push(k);if(!ks.length)break;cnt[ks[Math.floor(Math.random()*ks.length)]]++}
  for(let k=1;k<=S;k++){
    const a=p[k-1],b=p[k],d=b>a?1:-1,mv=Math.abs(b-a),n=cnt[k],G=GR[k]||0;let tmp,st=0,en=0,inn=-1;
    // a big gap sits inside the move, at its start (opening gap) or at its end
    if(G){const o=[];if(n>=2)o.push(0);if(k>1)o.push(1);if(k<S)o.push(2);const pl=o[Math.floor(Math.random()*o.length)];if(pl===1)st=G;else if(pl===2)en=G;else inn=Math.floor(Math.random()*(n-1))}
    for(let neg=cx;;neg=false){
      // gaps between candles of one move may go with the move (+) or against it (-)
      const sg=[];for(let j=0;j<n-1;j++){const g=j===inn?G:(Math.random()<gp?gsz():0);sg.push(g&&neg&&j!==inn&&Math.random()<.4?-g:g)}
      let sp=0,sn=0;sg.forEach((s,j)=>{if(j!==inn){s>0?sp+=s:sn+=s}});
      const room=mv-n*MINB-sn-st-en-(inn>=0?G:0);if(sp>room){const f=Math.max(0,room)/sp;for(let j=0;j<sg.length;j++)if(sg[j]>0&&j!==inn)sg[j]*=f}
      for(let j=0;j<sg.length;j++)if(sg[j]>0&&j!==inn&&sg[j]<GMIN)sg[j]=0;
      const w=Array.from({length:n},()=>rnd(.6,1.4)),ws=w.reduce((x,y)=>x+y,0),T=mv-sg.reduce((x,y)=>x+y,0)-st-en;
      let pos=a+d*st,ok=true;tmp=[];
      for(let j=0;j<n;j++){const bd=MINB+(T-n*MINB)*w[j]/ws,cl=pos+d*bd;tmp.push({o:pos,c:cl,d});
        if(j<n-1){if(d*(b-cl)<.4)ok=false;pos=cl+d*(sg[j]||0);if(d*(pos-a)<.6)ok=false}}
      if(ok||!neg)break;
    }
    if(en)bigB.add(k);if(st)bigB.add(k-1);
    tmp[tmp.length-1].c=b-d*en;cd.push(...tmp);last[k]=cd.length-1;
  }
  // gaps at a change of direction: with the candle before it, or with the candle after it
  for(let k=1;k<S;k++){const i=last[k];if(!bigB.has(k)&&Math.random()<gp){const g0=gsz();
    if(Math.random()<.5){const g=Math.min(g0,Math.abs(cd[i].c-cd[i].o)-MINB);if(g>=GMIN)cd[i].c-=cd[i].d*g}
    else{const q=cd[i+1],g=Math.min(g0,Math.abs(q.c-q.o)-MINB);if(g>=GMIN)q.o+=q.d*g}}}
  cd.forEach(k=>{k.hi=Math.max(k.o,k.c)+(adv?wickLen():Math.random()<.2?0:1+Math.random()*4);k.lo=Math.min(k.o,k.c)-(adv?wickLen():Math.random()<.2?0:1+Math.random()*4)});
  return{cd,e:effective(cd)};
}
// In candle charts the first candle that closes beyond a control point to break a trend must clear it by a visible distance
const brkOK=(cd,e,a)=>{for(const ev of a.ev){if(ev.k!=='b')continue;const L=ev.cp.t==='U'?ev.cp.lo:ev.cp.hi;let ok=false;
  for(let m=e.ptc[ev.i-1];m<=e.ptc[ev.i];m++){const c=cd[m].c;if(ev.cp.t==='U'?c<L:c>L){ok=Math.abs(c-L)>=MINBR;break}}
  if(!ok)return false}return true};
// A gap against the move adds real turning points, so the chart is re-analysed and only kept if the story is unchanged
function toCandles(c,N,adv){
  const a0=analyse(c.p),k0=phases({p:c.p,ev:a0.ev,cp:a0.cp}).map(s=>s.k).join('');
  for(let t=0;t<16;t++){
    const r=convert(c,N,adv,t<10),e=r.e,same=e.p.length===c.p.length&&e.p.every((v,i)=>Math.abs(v-c.p[i])<1e-6);

      if(ans!==c.ans||a2.cp.t!==c.cp.t||Math.abs(a2.cp.hi-c.cp.hi)>1e-6||Math.abs(a2.cp.lo-c.cp.lo)>1e-6||phases({p:e.p,ev:a2.ev,cp:a2.cp}).map(s=>s.k).join('')!==k0)continue}

    if(!same){c.p=e.p;c.cp=a2.cp;c.cur=a2.cur;c.ev=a2.ev;c.rel=a2.cur?relevant(e.p,a2.cp):null}

}
function quiz(m){
  const adv=m==='adv',N=adv?36:24,cn=m!=='line',ns=()=>adv?R(7,8):5;
  let nu,nd,nc;do{nu=R(2,5);nd=R(2,5);nc=10-nu-nd}while(nc<1||nc>3);
  const want=[...Array(nu).fill('Uptrend'),...Array(nd).fill('Downtrend'),...Array(nc).fill('Consolidation')].sort(()=>Math.random()-.5);
  const ix=want.map((_,i)=>i).sort(()=>Math.random()-.5),f=ix.find(k=>want[k]!=='Consolidation'),rest=ix.filter(k=>k!==f),hs=[f,...rest.slice(0,R(1,2))],hc=rest[Math.floor(Math.random()*rest.length)];
  // each Advanced chart independently has ~20% chance of a gap over 20% of its height (larger gaps rarer), ~30% of a 9-20% gap; several are possible
  const mkPlan=()=>{const a=Math.random(),v=a<.79?0:a<.95?1:2,b=Math.random(),l=b<.65?0:b<.93?1:2,o=[];
    for(let j=0;j<v;j++)o.push({tier:'V',r:.24+.18*Math.pow(Math.random(),2)});for(let j=0;j<l;j++)o.push({tier:'L',r:.09+.15*Math.pow(Math.random(),1.5)});return o};
  const pl=want.map(()=>adv?mkPlan():[]);
  [hc,f].forEach(k=>{if(pl[k].length){const j=ix.find(x=>!pl[x].length&&x!==hc&&x!==f);if(j!==undefined)[pl[k],pl[j]]=[pl[j],pl[k]]}});  // keep the guaranteed special charts free of big-gap plans
  const hasC=c=>phases(c).some(s=>s.k==='c');
  const ok=(c,i,w,strict)=>c&&c.ans===w&&(!cn||capOf(c,N)>=N)&&(!strict||((i!==hs[0]||c.secs.some(x=>x.k==='W'))&&(!hs.includes(i)||i===hs[0]||c.hard)&&(i!==hc||hasC(c))))&&(!cn||!!toCandles(c,N,adv));
  const out=want.map((w,i)=>{let c,g=0,done=false;do{c=build(i===hs[0],ns(),pl[i]);g++;done=!!ok(c,i,w,true)}while(!done&&g<40000);if(!done)do{c=build(false,ns())}while(!ok(c,i,w,false));return c});
  return out;
}
function why(c){
  const x=c.secs[c.secs.length-1],tn=NAME[x.tr].toLowerCase(),hl=x.tr>0?'a higher high and higher low':'a lower high and lower low';
  return {E:`Three directional segments with ${x.tr>0?'higher highs and higher lows':'lower highs and lower lows'} form a ${tn}.`,
   C:`The last segment closed beyond the control point in the trend's direction, so the ${tn} continues.`,
   I:`The last pullback stayed inside the control points, so the ${tn} is unchanged.`,
   X:`The last segment closed beyond the control point against the trend, breaking it. No new trend has formed yet, so the market is in consolidation.`,
   N:`After the break, the market formed ${hl}, completing three directional segments: a new ${tn}.`,
   T:`After the break, the market formed ${hl} inside the range of the break and consolidation, completing three directional segments: a new ${tn}.`,
   W:`Measured from the last control point, the market had already formed ${hl} while still inside the old control points. Closing beyond them broke the old trend and confirmed the new ${tn}.`,
   Y:`Measured from the last control point, the market formed ${hl} (ignoring the small moves in between) while still inside the old control points. Closing beyond them broke the old trend and confirmed the new ${tn}.`,
   F:`After the break there is only a single counter-segment. Three directional segments haven't formed yet, so the market is still in consolidation.`}[x.k];
}
//UI
let mode=null,Q=[],i=0,score=0,log=[],step=0;
const $=document.getElementById('app'),TT=document.getElementById('ttl'),SB=document.getElementById('sub');
const MODES={line:'Line Chart',candle:'Candlestick Chart',adv:'Advanced Candlestick Chart'},NM=t=>t==='U'?['Higher High','Higher Low']:['Lower High','Lower Low'];
function menu(){
  mode=null;TT.textContent='Trend Quiz';SB.textContent='Choose a quiz.';
  $.innerHTML=`<div class="menu">${Object.keys(MODES).map(k=>`<button class="mc" data-m="${k}">${MODES[k]}</button>`).join('')}</div>`;
  $.querySelectorAll('.mc').forEach(b=>b.onclick=()=>start(b.dataset.m));
}
function start(m){mode=m;Q=quiz(m);i=0;score=0;log=[];TT.textContent='Trend Quiz: '+MODES[m];SB.textContent='';show()}
function geom(c){
  const W=700,H=470,L=c.cd,P=c.gp||c.p,n=P.length,mn=L?Math.min(...L.map(k=>k.lo)):Math.min(...P),mx=L?Math.max(...L.map(k=>k.hi)):Math.max(...P);
  const N=L?L.length:n,x0=L?48:40,pt=(W-2*x0)/Math.max(N-1,1);
  return{W,H,L,pt,Y:v=>30+(mx-v)*(H-100)/(mx-mn),X:k=>x0+(L?c.ptc[k]:k)*pt,x0};
}
function base(c,G,op,vis=Infinity){
  let g=`<g opacity="${op}">`;
  if(G.L){const bw=Math.min(24,G.pt*.64);
    G.L.forEach((k,j)=>{if(j>=vis)return;const x=G.x0+j*G.pt,col=k.d>0?'#22a95f':'#e43e53',t=G.Y(Math.max(k.o,k.c)),b=G.Y(Math.min(k.o,k.c));
      g+=`<line x1="${x}" x2="${x}" y1="${G.Y(k.hi)}" y2="${G.Y(k.lo)}" stroke="${col}" stroke-width="2.5"/><rect x="${x-bw/2}" y="${t}" width="${bw}" height="${Math.max(3,b-t)}" fill="${col}"/>`})}
  else g+=`<polyline fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="${c.p.slice(0,vis).map((v,k)=>G.X(k)+','+G.Y(v)).join(' ')}"/>`;
  return g+'</g>';
}
function path(c,G,idx,col,w){
  const pts=idx.map(k=>G.X(k)+','+G.Y(c.p[k])).join(' '),s=`fill="none" stroke-linejoin="round" stroke-linecap="round" points="${pts}"`;
  return (G.L?`<polyline ${s} stroke="var(--card)" stroke-width="${w+5}"/>`:'')+`<polyline ${s} stroke="${col}" stroke-width="${w}"/>`;
}
function ctl(c,G,cp,cur){
  const nm=NM(cp.t),col=cur?'#f59e0b':'#94a3b8',tc=cur?'var(--acc)':'var(--muted)';let g='';
  [[cp.hi,cp.hiI,nm[0],-9],[cp.lo,cp.loI,nm[1],21]].forEach(([v,k,t,dy])=>{const x=G.X(k),y=G.Y(v);
    g+=`<line x1="${x}" x2="${G.W-12}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="${x}" cy="${y}" r="6" fill="${col}" stroke="var(--card)" stroke-width="2"/><text x="${G.W-14}" y="${y+dy}" text-anchor="end" font-size="15" font-weight="700" fill="${tc}" stroke="var(--card)" stroke-width="4" style="paint-order:stroke">${cur?'':'Previous '}Control Point (${t})</text>`});
  return g;
}
const legend=(G,col,t,row=0)=>`<line x1="40" x2="72" y1="${G.H-22-row*24}" y2="${G.H-22-row*24}" stroke="${col}" stroke-width="6" stroke-linecap="round"/><text x="80" y="${G.H-16-row*24}" font-size="15" font-weight="700" fill="${col}">${t}</text>`;
const wrap=(G,c,g)=>`<svg viewBox="0 0 ${G.W} ${G.H}" role="img" aria-label="${G.L?'Candlestick':'Line'} chart">${g}</svg>`;
function chart(c,reveal,vis=Infinity){
  const G=geom(c),full=vis>=(c.cd?c.cd.length:c.p.length);let g=base(c,G,1,vis);
  if(reveal&&full&&c.rel){const col=c.cp.t==='U'?'#22c55e':'#ef4444';g+=path(c,G,c.rel,col,6)+legend(G,col,'Last 3 relevant segments')}
  if(reveal&&full)g+=ctl(c,G,c.cp,c.cur);

}
// Breakdown slideshow: one picture per trend, per break, and per run of movements that do not form a trend
const TC=t=>t==='U'?'#22c55e':'#ef4444',TN=t=>t==='U'?'uptrend':'downtrend',CTLN=t=>t==='U'?'Higher Low':'Lower High';
function slide(c,s){

  else if(s.k==='B'){g+=path(c,G,chain(c.p,s.cp),TC(s.cp.t),4)+ctl(c,G,s.cp,true)+path(c,G,[s.i-1,s.i],'#8b5cf6',8)+legend(G,'#8b5cf6','Break: closed '+(s.cp.t==='U'?'below':'above')+' the '+CTLN(s.cp.t))}
  else{const idx=[];for(let k=s.a;k<=s.b;k++)idx.push(k);g+=path(c,G,idx,'#1d9bf0',6)+ctl(c,G,s.cp,false)+legend(G,'#1d9bf0','Movements that do not form a trend')}

function caption(c,s,last){
  const nm=NM(s.cp.t);let t;
  if(s.k==='T')t=`${TN(s.cp.t)[0].toUpperCase()+TN(s.cp.t).slice(1)}: only the relevant segments are shown (${chain(c.p,s.cp).length-1} in total). Control points sit at the ${nm[0]} and ${nm[1]}.`;
  else if(s.k==='B')t=`Break: price closed ${s.cp.t==='U'?'below the Higher Low':'above the Lower High'}, the control point protecting the ${TN(s.cp.t)}. Closing beyond a control point against the trend breaks it, so the ${TN(s.cp.t)} is broken.`;
  else t=`These movements after the break do not create a new trend (three directional segments of ${s.cp.t==='U'?'lower highs and lower lows, or higher highs and higher lows':'higher highs and higher lows, or lower highs and lower lows'} have not formed), so the market is in consolidation.`;

function bd(){

// Draw / erase tool drawn on a canvas over the chart, with undo and redo
const DR={tool:null,color:'#ef4444',size:5,st:[],rd:[]},COLS=['#ef4444','#f59e0b','#22c55e','#1d9bf0','#8b5cf6','ink'];
const toolbar=()=>`<div class="tools"><button class="tb" id="tpen">✏️ Draw</button><button class="tb" id="ter">🧽 Erase</button><select id="tsz" class="tb" aria-label="Brush size"><option value="2">Fine</option><option value="5">Medium</option><option value="10">Thick</option><option value="18">Extra thick</option></select>${COLS.map((c,k)=>`<button class="sw" data-c="${c}" style="background:${c==='ink'?'var(--ink)':c}" aria-label="Colour ${k+1}"></button>`).join('')}<span class="sp"></span><button class="tb" id="tun">↶ Undo</button><button class="tb" id="tre">↷ Redo</button><button class="tb" id="tcl">🗑 Clear</button></div>`;
function drawInit(){
  DR.st=[];DR.rd=[];
  const cv=document.getElementById('cv'),box=document.getElementById('chw'),ctx=cv.getContext('2d'),g=id=>document.getElementById(id);let cur=null,F;

  const upd=()=>{g('tpen').classList.toggle('on',DR.tool==='pen');g('ter').classList.toggle('on',DR.tool==='er');g('tsz').value=DR.size;
    document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===DR.color));
    g('tun').disabled=!DR.st.length;g('tre').disabled=!DR.rd.length;g('tcl').disabled=!DR.st.length||!!DR.st[DR.st.length-1].x;
    cv.style.pointerEvents=DR.tool?'auto':'none';cv.style.touchAction=DR.tool?'none':'auto';cv.style.cursor=DR.tool?'crosshair':'default'};
  const wipe=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore()};
  const redraw=()=>{F=ref();wipe();DR.st.forEach(s=>s.x?wipe():s.p.forEach((q,k)=>seg(s,s.p[Math.max(0,k-1)],q)));upd()};

// Replay slider: hides everything to the right of it and snaps to each point (line charts) or each gap between candles
let REV=false,VP=Infinity;
const SG=c=>{const W=700,L=c.cd,N=L?L.length:c.p.length,x0=L?48:40,pt=(W-2*x0)/Math.max(N-1,1);return{W,min:L?1:2,max:N,x:v=>L?x0+(v-.5)*pt:x0+(v-1)*pt,unit:L?'candles':'points'}};

  return `<div class="slw"><input type="range" id="${id}" min="${g.min}" max="${g.max}" step="1" value="${val??g.max}" aria-label="Show the chart up to this position" style="width:calc(${100-l-r}% + 28px);margin-left:calc(${l}% - 14px)"><div class="slt" id="${tid}"></div></div>`};
function sliderReset(c){const g=SG(c),s=document.getElementById('sl');s.value=g.max;VP=g.max;document.getElementById('slt').textContent=`Showing ${g.max} of ${g.max} ${g.unit}`}
function sliderInit(c){

function show(){

    $.innerHTML=`<div class="card" style="text-align:center"><div class="sub">${MODES[mode]} quiz complete</div><div class="big">${score} / 10</div><p>${score>=9?'Excellent trend reading.':score>=7?'Solid. Review the questions you missed below.':'Keep practising: revisit the control point and break rules.'}</p></div>`+
    log.map((l,k)=>`<div class="rev"><span>Q${k+1}: ${l.ans}</span><span>${l.ok?'✓':'✗ you chose '+l.pick}</span></div>`).join('')+
    `<div class="row"><button class="next" id="again">Try a new set</button><button class="next alt" id="back">Back to quiz selection</button></div>`;

  }

function answer(o){
  const c=Q[i],ok=o===c.ans;if(ok)score++;log.push({ans:c.ans,pick:o,ok});step=0;
  $.querySelectorAll('.opts button').forEach(b=>{b.disabled=true;if(b.dataset.o===c.ans)b.classList.add('ok');else if(b.dataset.o===o)b.classList.add('bad')});

  document.getElementById('bdb').onclick=()=>{const v=document.getElementById('bdv');if(v.innerHTML){v.innerHTML=''}else{step=0;bd();v.scrollIntoView({behavior:'smooth',block:'nearest'})}};

menu();
